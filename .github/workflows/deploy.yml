name: Refresh and publish
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 20 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Refresh public opportunities
        run: node scripts/generate-public-data.js
      - name: Save public snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/opportunities.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public opportunities [skip ci]'
            git push
          fi
      - run: npm run build
        env:
          VITE_PUBLIC_MODE: 'true'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
